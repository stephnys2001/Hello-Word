<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7fb">
    <meta name="description" content="Enter your name.">
    <title>Enter your name</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
        color: #242743;
        background: #f6f7fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        --muted: #777b91;
        --accent: #6558d9;
        --accent-dark: #5145c4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background:
          radial-gradient(ellipse at 12% 16%, #e8e8ff 0, transparent 34%),
          radial-gradient(ellipse at 90% 86%, #e7f2ff 0, transparent 32%),
          #f6f7fb;
      }

      main {
        width: min(100%, 520px);
        overflow: hidden;
        border: 1px solid #eaebf2;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 24px 70px rgb(46 47 91 / 10%);
      }

      .content {
        padding: 40px;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 2.75rem);
        letter-spacing: -0.06em;
        line-height: 1.08;
      }

      .intro {
        margin: 14px 0 30px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.65;
      }

      form {
        display: grid;
        gap: 12px;
      }

      label {
        font-size: 0.88rem;
        font-weight: 700;
      }

      input {
        width: 100%;
        min-height: 54px;
        padding: 0 15px;
        border: 1px solid #dfe1ec;
        border-radius: 12px;
        outline: none;
        background: #fff;
        color: #242743;
        font: inherit;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      input:focus-visible {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgb(101 88 217 / 14%);
      }

      button {
        min-height: 54px;
        margin-top: 8px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-size: 0.96rem;
        font-weight: 700;
        transition: background 160ms ease, transform 160ms ease;
      }

      button:hover {
        background: var(--accent-dark);
      }

      button:active {
        transform: translateY(1px);
      }

      button:focus-visible,
      .back-link:focus-visible {
        outline: 3px solid #aaa2ff;
        outline-offset: 3px;
      }

      .message {
        min-height: 1.5em;
        margin: 18px 0 0;
        color: var(--accent-dark);
        font-weight: 650;
      }

      .back-link {
        display: block;
        margin-top: 22px;
        color: var(--muted);
        font-size: 0.9rem;
        text-align: center;
        text-decoration: none;
      }

      .back-link:hover {
        color: var(--accent-dark);
      }

      footer {
        padding: 15px 40px;
        border-top: 1px solid #f0f0f5;
        color: #888b9c;
        font-size: 0.78rem;
        text-align: center;
      }

      @media (max-width: 480px) {
        .content {
          padding: 30px 24px;
        }

        footer {
          padding: 14px 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="content">
        <p class="eyebrow">One more thing</p>
        <h1>What’s your name?</h1>
        <p class="intro">Enter your first and last name below.</p>
        <form id="name-form">
          <label for="first-name">First name</label>
          <input id="first-name" name="firstName" type="text" autocomplete="given-name" maxlength="80" required>
          <label for="last-name">Last name</label>
          <input id="last-name" name="lastName" type="text" autocomplete="family-name" maxlength="80" required>
          <button type="submit">Continue</button>
        </form>
        <p class="message" id="message" role="status" aria-live="polite"></p>
        <a class="back-link" href="index.html">Back to the age calculator</a>
      </div>
      <footer>Your name stays in your browser.</footer>
    </main>
    <script>
      const form = document.querySelector("#name-form");
      const firstNameInput = document.querySelector("#first-name");
      const lastNameInput = document.querySelector("#last-name");
      const message = document.querySelector("#message");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const firstName = firstNameInput.value.trim();
        const lastName = lastNameInput.value.trim();
        if (!firstName || !lastName) {
          message.textContent = "Please enter both your first and last name.";
          (firstName ? lastNameInput : firstNameInput).focus();
          return;
        }
        message.textContent = `Nice to meet you, ${firstName} ${lastName}!`;
      });
    </script>
  </body>
</html>
